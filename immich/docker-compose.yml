---
services:
  app:
    container_name: immich-app
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - data:/data
#      - /mnt/immich:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
#    ports:
#      - 2283:2283
    depends_on:
      - redis
      - database
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.photos.entrypoints=websecure"
      - "traefik.http.routers.photos.rule=Host(`photos.mckay.one`) || Host(`immich.mckay.one`)"
      - "traefik.http.routers.photos.tls=true"
      - "traefik.http.routers.photos.tls.certresolver=cf"
    networks:
      - immich
      - proxy

  machine_learning:
    container_name: immich-machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    networks:
      - immich

  redis:
    container_name: immich-redis
    image: redis:6.2-alpine@sha256:80cc8518800438c684a53ed829c621c94afd1087aaeb59b0d4343ed3e7bcf6c5
    restart: always
    # needs volume for /data
    networks:
      - immich

  db:
    container_name: immich-db
    image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - immich

  immich-pet_tagger_josiah:
    image: ghcr.io/tedornitier/immich-pet-tagger:cpu
    container_name: immich-pet_tagger_j
    restart: unless-stopped
    ports:
      - "3002:8000"
    environment:
      - IMMICH_URL=http://immich_server:2283      # name of your Immich container
     # - IMMICH_API_KEY=6jXmT4UGiSLe0t40LGCrM74zBPFW8umXOuGRQeyJms # Admin account
      - IMMICH_API_KEY=7KitkETkLQJDM4ohpgHZc60ONr3H2nw8LUoRMUlVU # Josiah account
      - IMMICH_EXTERNAL_URL=https://photos.mckay.one # how your browser reaches Immich
      - POLL_INTERVAL=300
      - GPU_WORKERS=2
      - THRESHOLD=0.8
    volumes:
      - pet-data:/data
    networks:
      - immich
    depends_on:
      - immich-app


  immich-pet_tagger_megan:
    image: ghcr.io/tedornitier/immich-pet-tagger:cpu
    container_name: immich-pet_tagger_m
    restart: unless-stopped
    ports:
      - "3003:8000"
    environment:
      - IMMICH_URL=http://immich_server:2283      # name of your Immich container
      - IMMICH_API_KEY=q2bgchqzfueMnfzkDWbHWLUA8vp6Ah3eP2z2bsNgs # Megans account
      - IMMICH_EXTERNAL_URL=https://photos.mckay.one # how your browser reaches Immich
      - POLL_INTERVAL=300
      - GPU_WORKERS=2
      - THRESHOLD=0.8
    volumes:
      - pet-data-megan:/data
    networks:
      - immich
    depends_on:
      - immich-app

volumes:
  pgdata:
  model-cache:
  pet-data:
  pet-data-megan:
  data:
    driver_opts:
      type: nfs
      o: addr=truenas.mckay.one,nfsvers=4,rw
      device: ":/mnt/McPool/docker/immich/data"

networks:
  proxy:
    external: true
  immich:
    external: true
