---
services:
  app:
    image: linuxserver/nextcloud:35.0.0
    container_name: nextcloud-app
    env_file: .env
    volumes:
      - config:/config
      - data:/data
    restart: unless-stopped
    networks:
      - proxy
      - nextcloud
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.rule=Host(`drive.mckay.one`)" # && (ClientIP(`10.0.0.0/8`) || ClientIP(`100.64.0.0/10`))"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.routers.nextcloud.tls.certresolver=cf"
      - "traefik.http.routers.nextcloud.priority=100"

      # - "traefik.http.routers.nextcloud-external.entrypoints=websecure"  
      # - "traefik.http.routers.nextcloud-external.rule=Host(`drive.mckay.one`) && (!ClientIP(`10.0.0.0/8`) || !ClientIP(`100.64.0.0/10`))"
      # - "traefik.http.routers.nextcloud-external.tls.certresolver=cf"
      # - "traefik.http.routers.nextcloud-external.middlewares=authentik@file"

      - "traefik.http.services.nextcloud.loadbalancer.server.port=443"
      - "traefik.http.services.nextcloud.loadbalancer.server.scheme=https"

      - "traefik.docker.network=proxy"

  db:
    image: postgres
    container_name: nextcloud-db
    restart: always
    env_file: .env
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - nextcloud

networks:
  proxy:
    external: true
  nextcloud:
    external: true


volumes:
  db:
  config:
    driver_opts:
      type: nfs
      o: addr=truenas.mckay.one,nfsvers=4,rw
      device: ":/mnt/McPool/docker/nextcloud/config"
  data:
    driver_opts:
      type: nfs
      o: addr=truenas.mckay.one,nfsvers=4,rw
      device: ":/mnt/McPool/docker/nextcloud/data"

