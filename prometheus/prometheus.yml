global:
  scrape_interval: 30s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'origen2'
    static_configs:
      - targets: ['10.10.1.6:9100']

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: 'home-assistant'
    scrape_interval: 60s
    metrics_path: /api/prometheus
    static_configs:
      - targets: ['10.10.1.4']

  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8082']
