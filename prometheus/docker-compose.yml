
services:
  prometheus:
    ports:
        - 9090:9090
    volumes:
        - ./prometheus.yml:/etc/prometheus/prometheus.yml
        - prometheus-data:/prometheus
    image: prom/prometheus
    networks:
      - monitoring
    command:
      - '--web.enable-admin-api'
      - '--config.file=/etc/prometheus/prometheus.yml'

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - monitoring


  pushgateway:
    image: prom/pushgateway
    ports:
      - 9091:9091
    networks:
      - monitoring


networks:
  monitoring:
    external: true

volumes:
  prometheus-data:
